<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1400">
<title>História Moderna da Visão Computacional na Patologia — Infográfico Interativo</title>
<style>
  :root{--purple:#0072B5;--lilac:#C42127;--green-d:#007A33;--blue:#00A8D8;--amber:#c9821a;
    --grey:#595959;--grey2:#8a93a6;--line:#d5dae3;--ink:#262626;--navy:#262626;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Segoe UI','Helvetica Neue','Microsoft YaHei','PingFang SC',Arial,sans-serif;color:var(--ink);
       width:1400px;margin:0 auto;background:#fbfbfd;}
  header{background:#fff;padding:66px 64px 8px;position:relative;}
  .langbar{position:absolute;top:18px;left:64px;display:flex;gap:6px;}
  .tiles{position:absolute;top:30px;right:64px;display:grid;grid-template-columns:repeat(5,30px);gap:5px;}
  .tiles div{width:30px;height:21px;border-radius:4px;}
  .kicker{font-size:14px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--purple);margin-bottom:6px;}
  header h1{font-size:44px;line-height:1.12;font-weight:800;max-width:1000px;}
  header h1 em{color:var(--purple);font-style:normal;}
  header .sub{font-size:18px;color:var(--grey);margin-top:10px;max-width:1050px;line-height:1.45;}
  .toolbar{display:flex;gap:10px;align-items:center;margin-top:18px;flex-wrap:wrap;}
  .toolbar .langs{display:flex;gap:6px;margin-right:14px;}
  .lbtn{border:2px solid var(--purple);background:#fff;color:var(--purple);font-weight:800;font-size:14px;
        padding:6px 13px;border-radius:8px;cursor:pointer;}
  .lbtn.on{background:var(--purple);color:#fff;}
  .abtn{border:none;background:#eef0f6;color:var(--ink);font-weight:700;font-size:14px;padding:8px 14px;
        border-radius:8px;cursor:pointer;}
  .abtn:hover{background:#e2e6ef;}
  .hint{font-size:13.5px;color:var(--grey2);margin-top:10px;}
  .bar{display:inline-block;background:var(--purple);color:#fff;font-weight:800;font-size:18px;
       padding:8px 22px;border-radius:10px 10px 0 0;cursor:pointer;user-select:none;}
  .bar .car{display:inline-block;margin-left:9px;transition:transform .25s;}
  .panel{border:2px solid var(--purple);border-radius:0 12px 12px 12px;background:#fff;padding:18px 22px;
         overflow:hidden;}
  .coll .panel{display:none;}
  .coll .bar .car{transform:rotate(-90deg);}
  .mini{padding:24px 64px 8px;}
  .mm-grid{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
  .yr{font-weight:800;font-size:15.5px;margin:0 4px 0 12px;}
  .chip{font-size:13px;font-weight:700;padding:4px 11px;border-radius:6px;color:#fff;}
  .c-grey{background:#595959;} .c-grey0{background:#8a93a6;} .c-purple{background:#0072B5;}
  .c-lilac{background:#C42127;} .c-blue{background:#00A8D8;} .c-green{background:#007A33;} .c-amber{background:#c9821a;}
  .legend{display:flex;gap:16px;margin-top:12px;flex-wrap:wrap;font-size:12.5px;color:var(--grey);}
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .dot{width:12px;height:12px;border-radius:3px;display:inline-block;}
  .concepts{padding:24px 64px 8px;display:flex;gap:28px;align-items:flex-start;}
  .concepts .half{flex:1;}
  .citem{border-bottom:1px dashed var(--line);}
  .citem:last-child{border-bottom:none;}
  .citem .ct{font-weight:800;color:var(--purple);font-size:15px;padding:9px 4px;cursor:pointer;
             display:flex;justify-content:space-between;align-items:center;user-select:none;}
  .citem .ct .pl{color:var(--grey2);font-weight:800;transition:transform .2s;}
  .citem.open .ct .pl{transform:rotate(45deg);}
  .citem .cd{display:none;font-size:13.8px;line-height:1.5;color:#262626;padding:0 4px 11px;}
  .citem.open .cd{display:block;}
  .roadwrap{padding:28px 64px 8px;}
  h2.sec{font-size:30px;font-weight:800;}
  .sec-sub{font-size:15.5px;color:var(--grey);margin:4px 0 6px;max-width:1100px;line-height:1.45;}
  .road{position:relative;width:1272px;height:1250px;margin-top:8px;}
  .road svg{position:absolute;inset:0;}
  .station{position:absolute;width:58px;height:58px;border-radius:50%;background:#fff;border:6px solid;
           display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14.5px;
           transform:translate(-50%,-50%);z-index:3;cursor:pointer;transition:box-shadow .2s, transform .15s;}
  .station:hover{transform:translate(-50%,-50%) scale(1.12);box-shadow:0 0 0 6px rgba(106,47,201,.12);}
  .station.on{box-shadow:0 0 0 6px rgba(106,47,201,.18);}
  .station .plus{position:absolute;right:-4px;bottom:-4px;width:19px;height:19px;border-radius:50%;
     background:var(--purple);color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;
     justify-content:center;line-height:1;}
  .station.on .plus{background:var(--grey2);}
  .mcard{position:absolute;width:274px;background:#fff;border:1px solid var(--line);border-radius:10px;
         padding:10px 13px;box-shadow:0 6px 18px rgba(14,34,64,.14);z-index:4;
         opacity:0;transform:scale(.92);pointer-events:none;transition:opacity .22s, transform .22s;}
  .mcard.show{opacity:1;transform:scale(1);pointer-events:auto;}
  .mcard .tag{display:inline-block;color:#fff;font-size:12px;font-weight:800;padding:2px 9px;border-radius:5px;margin-bottom:5px;}
  .mcard .t{font-size:14.5px;font-weight:800;line-height:1.25;margin-bottom:3px;}
  .mcard p{font-size:12.6px;line-height:1.42;color:#262626;}
  .mcard .ref{font-size:11px;color:var(--grey2);margin-top:4px;}
  .mcard .x{position:absolute;top:6px;right:9px;color:var(--grey2);font-weight:800;cursor:pointer;font-size:13px;}
  .eras{padding:22px 64px 8px;display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  .era-card{border-radius:14px;background:#fff;border:1px solid var(--line);border-top:6px solid;
            box-shadow:0 2px 8px rgba(14,34,64,.06);}
  .era-head{padding:18px 24px 14px;cursor:pointer;user-select:none;position:relative;}
  .era-head .pl{position:absolute;top:18px;right:20px;font-size:22px;font-weight:800;color:var(--grey2);transition:transform .2s;}
  .era-card.open .era-head .pl{transform:rotate(45deg);}
  .era-tag{display:inline-block;font-size:12.5px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;
           color:#fff;padding:4px 11px;border-radius:6px;margin-bottom:8px;}
  .era-head h3{font-size:20px;font-weight:800;line-height:1.2;margin-bottom:2px;}
  .era-head .years{font-size:13.5px;font-weight:700;color:var(--grey);}
  .era-body{display:none;padding:0 24px 18px;}
  .era-card.open .era-body{display:block;}
  .evento{font-size:13.5px;font-weight:700;padding:8px 12px;border-radius:9px;margin-bottom:10px;}
  .tech{background:#f6f7fa;border-radius:9px;padding:11px 14px;font-size:13.2px;line-height:1.48;margin-bottom:10px;}
  .pm{display:flex;gap:9px;margin:8px 0;}
  .pm .p,.pm .m{flex:1;border-radius:9px;padding:8px 12px;font-size:12.6px;line-height:1.4;}
  .pm .p{background:#eaf4ec;} .pm .m{background:#faeef0;}
  .bench{font-size:13.5px;line-height:1.5;margin-bottom:8px;}
  .refs{font-size:11.8px;color:var(--grey2);line-height:1.5;border-top:1px dashed var(--line);padding-top:8px;}
  .charts{padding:22px 64px 10px;display:flex;gap:22px;align-items:flex-start;}
  .chartcard{flex:1;}
  img.chart{width:100%;height:auto;display:block;}
  .wave-legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px;font-size:12.5px;color:var(--grey);}
  .wave-legend span{display:inline-flex;align-items:center;gap:6px;}
  .small{font-size:12.2px;color:var(--grey);line-height:1.45;margin-top:8px;}
  footer{background:var(--navy);color:#8fa0c0;padding:28px 64px;font-size:12.8px;line-height:1.65;margin-top:26px;}
  footer b{color:#c9d2e4;}
</style>
</head>

const L = {"pt": {"docTitle": "História Moderna da Visão Computacional na Patologia — Infográfico Interativo", "ui": {"open": "Abrir tudo", "close": "Fechar tudo", "hint": "Clique nas bolinhas dos anos, nos conceitos, nas eras e nos gráficos para abrir e fechar o conteúdo."}, "h1": "História Moderna da <em>Visão Computacional na Patologia</em>", "kicker": "Infográfico interativo", "sub": "A trajetória dos algoritmos que aprenderam a olhar lâminas: da visão de máquina dos anos 1990 aos modelos de fundação e à IA generativa — o que cada técnica permite, o que custa, e o marco prático que cada era desbloqueou.", "mmT": "MiniMapa", "mm": [["'97", [["c-grey0", "textura localiza displasia"]]], ["'04", [["c-grey0", "mapas digitais de tecido"]]], ["'08–'12", [["c-grey", "morfometria em WSI"], ["c-grey", "telepatologia"]]], ["'13", [["c-purple", "1ª CNN (mitoses)"]]], ["'15", [["c-purple", "DL em patches"]]], ["'17", [["c-grey", "FDA: 1º sistema WSI"]]], ["'18", [["c-purple", "Coudray"], ["c-lilac", "CAMELYON"]]], ["'19", [["c-lilac", "Campanella (MIL)"]]], ["'21", [["c-lilac", "CLAM"], ["c-lilac", "FDA: Paige Prostate"], ["c-blue", "ViT / destilação"]]], ["'22", [["c-blue", "CTransPath · HIPT"]]], ["'23", [["c-green", "1ºs modelos de fundação"]]], ["'24", [["c-green", "UNI"], ["c-green", "Virchow"], ["c-amber", "PathChat"]]], ["'25", [["c-green", "UNI2 · TITAN"]]], ["'26", [["c-amber", "IA agêntica"]]]], "legend": [["#8a93a6", "visão de máquina (era 0)"], ["#595959", "ML clássico"], ["#0072B5", "CNN supervisionada"], ["#C42127", "MIL / supervisão fraca"], ["#00A8D8", "transformer / auto-supervisão"], ["#007A33", "modelos de fundação"], ["#c9821a", "generativa / visão-linguagem"]], "cAT": "Conceitos de imagem & aprendizado", "cA": [["WSI (whole slide image)", "A lâmina inteira digitalizada em gigapixels. Grande demais para uma rede processar de uma vez — por isso quase tudo começa recortando."], ["Patch / tile", "Recorte pequeno da WSI (ex.: 256×256 px) processado individualmente. A unidade básica de trabalho da visão computacional em patologia."], ["Feature (característica)", "O que o modelo mede para decidir. No ML clássico, o humano define (forma nuclear, textura); no deep learning, a rede aprende sozinha quais características importam."], ["CNN (rede convolucional)", "Rede neural que varre a imagem com filtros aprendidos, dos traços simples (bordas) aos complexos (glândulas). Motor da revolução de 2013–2018."], ["Anotação e supervisão forte", "Marcação manual do patologista, pixel a pixel ou região a região, dizendo à rede onde está cada coisa. Precisa — e cara: o grande gargalo da era CNN."], ["Transformer / ViT", "Arquitetura que trata a imagem como uma sequência de \"tokens\". Na patologia, o ViT processa um patch por vez — não a lâmina inteira: dentro do patch, aprende relações entre todas as regiões, sem se limitar à vizinhança dos filtros convolucionais."], ["Auto-supervisão", "Treinar sem rótulo nenhum: a rede aprende prevendo partes ocultas da imagem ou aproximando visões da mesma região (contrastivo, DINO, masked autoencoding)."]], "cBT": "Conceitos de patologia computacional", "cB": [["MIL (multiple instance learning)", "A lâmina vira uma \"sacola\" de patches com um único rótulo — o diagnóstico do laudo. Basta existir um patch positivo para a sacola ser positiva; a rede descobre quais patches sustentam o rótulo."], ["Atenção (attention)", "Mecanismo que pesa quanto cada patch contribui para a decisão da lâmina — e, de quebra, mostra onde o modelo \"olhou\". É essa agregação por atenção (no MIL), e não um transformer sobre a WSI inteira, que leva a decisão ao nível da lâmina."], ["Embedding", "A \"impressão digital\" numérica que um encoder extrai de um patch ou de uma lâmina. É sobre embeddings que quase tudo é construído hoje."], ["Modelo de fundação (foundation model)", "Encoder pré-treinado por auto-supervisão em centenas de milhares a milhões de lâminas, reaproveitável para muitas tarefas — ninguém mais começa do zero."], ["Fine-tuning · few-shot · zero-shot", "Adaptar o modelo de fundação com poucos exemplos (fine-tuning/few-shot) — ou usá-lo sem nenhum exemplo da tarefa (zero-shot)."], ["Visão-linguagem / generativa", "Alinhar o encoder visual a um modelo de linguagem: o sistema passa a responder perguntas sobre a imagem e a gerar texto — inclusive rascunhos de laudo."], ["Validação externa & regulação", "Testar em serviços, scanners e populações diferentes dos de treino; para uso clínico, autorização regulatória (FDA/CE). O que separa benchmark de bancada."]], "roadT": "A estrada do tempo", "roadS": "Siga a estrada: cada estação é um marco. Clique na bolinha do ano para abrir o cartão.", "ms": {"m97": ["visão de máquina", "Textura localiza a displasia", "Textura (co-ocorrência) + regra linear localizam campos displásicos em mucosa colorretal digitalizada (83–86%).", "1997 · J Pathol 182:68-75 · Hamilton et al."], "m04": ["visão de máquina", "Mapas digitais do tecido", "Próstata: morfologia identifica tecido normal; textura de Haralick separa estroma × carcinoma (79,3% dos subcampos) — e o artigo já antecipa a extensão a WSIs.", "2004 · Hum Pathol 35:1121-31 · Diamond et al."], "m08": ["ML clássico", "Morfometria e análise clássica", "Features manuais (forma, textura, cor) + classificadores rasos, agora sobre lâminas digitalizadas.", "2008–12 · PMID 28626265 (2009)"], "m13": ["CNN", "Primeira CNN em patologia", "Classificação de figuras de mitose no desafio ICPR: CNN combinada a features manuais — a transição entre eras em um só artigo.", "2013 · J Pathol Inform · PMID 23858384"], "m15": ["CNN", "Deep learning se espalha", "Grading de gliomas, mitoses e segmentação patch a patch: o deep learning começa a bater o ML clássico.", "2015–2016 · ex.: PMID 26958289"], "m16": ["marco", "O campo se organiza", "Revisões-marco definem \"análise de imagem e machine learning em patologia digital\": desafios, oportunidades e a agenda da década.", "2016 · PMID 27423409"], "m17": ["infraestrutura", "FDA libera o 1º sistema WSI", "Primeiro sistema de imagem de lâmina inteira aprovado para diagnóstico primário: a base digital sem a qual nada do que segue chega à rotina.", "2017 · FDA (Philips IntelliSite)"], "m18cam": ["benchmark", "CAMELYON16/17", "1.399 WSIs de linfonodo sentinela, anotadas, de 5 centros — o benchmark público que acelerou a corrida da detecção de metástases.", "2018 · GigaScience · PMID 29860392"], "m18cou": ["CNN", "Coudray: ver o invisível", "Inception v3 separa LUAD × LUSC × normal (AUC 0,97) e prevê 6 mutações (EGFR, KRAS, TP53…) direto do H&E — o genótipo deixa rastro no fenótipo.", "2018 · Nat Med · PMID 30224757"], "m19": ["MIL", "Campanella: escala clínica", "MIL com o laudo como rótulo: 44.732 WSIs, sem anotação manual; AUC > 0,98. Excluiria 65–75% das lâminas mantendo sensibilidade de 100%.", "2019 · Nat Med · PMID 31308507"], "m21clam": ["MIL", "CLAM: atenção interpretável", "MIL com atenção e clustering: eficiente em dados, generalizável — e mostra onde o modelo olhou. Ferramenta de trabalho da era.", "2021 · Nat Biomed Eng · PMID 33649564"], "m21paige": ["regulação", "Paige Prostate: 1ª IA autorizada", "FDA autoriza (De Novo) a primeira IA de patologia para uso clínico — detecção de câncer em biópsias de próstata. A pesquisa vira produto.", "2021 · FDA De Novo"], "m22": ["auto-superv.", "CTransPath · HIPT", "Auto-supervisão e ViTs chegam à histologia: encoders de patches treinados sem rótulos, reaproveitáveis — a ponte para a fundação. A lâmina inteira segue agregada por MIL/atenção.", "2021–2022 · 1º sinal: PMID 34531005"], "m23": ["fundação", "Nasce a era da fundação", "Os primeiros \"pathology foundation models\" aparecem na literatura; a pergunta muda de \"como treinar?\" para \"qual fundação adaptar?\".", "2023 · primeiras menções no PubMed"], "m24uni": ["fundação", "UNI & Virchow", "UNI: 100 mil WSIs, 34 tarefas, few-shot até 108 tipos de câncer. Virchow: 1,5 milhão de lâminas; pan-câncer AUROC 0,95 — inclusive 7 cânceres raros.", "2024 · Nat Med · PMIDs 38504018, 39039250"], "m24pc": ["generativa", "PathChat: o copiloto", "Visão-linguagem generalista para patologia: responde perguntas sobre a imagem em linguagem natural; preferido por patologistas vs. assistentes gerais.", "2024 · Nature · PMID 38866050"], "m25": ["fundação", "TITAN · UNI2", "Fundação multimodal no nível da lâmina — agrega embeddings de patches (335 mil WSIs + laudos): recupera casos raros e gera rascunho de laudo, zero-shot.", "2025 · Nat Med · PMID 41193692"], "m26": ["fronteira", "IA agêntica e validação", "Sistemas que orquestram detecção + quantificação + texto; benchmarks clínicos comparam fundações públicas; regulação e robustez viram o centro do debate.", "2025–2026 · ex.: PMID 40240324"]}, "erasT": "As eras em detalhe — do momento 0 à era 6", "erasS": "Clique em cada era para expandir: como funciona, o marco prático, o que ganha, o que custa — e onde toca a bancada.", "lbl": {"how": "Como funciona:", "bench": "Bancada:"}, "eras": {"e0": ["Era 0 · anos 1990–2000", "Momento 0 — visão de máquina antes da lâmina digital", "análise de textura em campos digitalizados, um a um — a prova de conceito de tudo o que veio depois", "Marco prático: a morfologia pode ser quantificada e classificada por computador — \"machine vision systems\" geram mapas digitais de composição do tecido, campo a campo.", "uma câmera acoplada ao microscópio digitaliza campos de visão; features de textura (matriz de co-ocorrência de Haralick) e medidas morfológicas alimentam regras de classificação lineares. Hamilton et al. (1997) localizam automaticamente os campos displásicos em mucosa colorretal (83–86% de acerto) — resolvendo \"o primeiro estágio do processo diagnóstico\": achar onde olhar. Diamond et al. (2004) mapeiam o tecido prostático: morfologia identifica o tecido normal, a textura de Haralick separa estroma de carcinoma (79,3% dos subcampos corretos) — e o próprio artigo antecipa a extensão lógica do método às lâminas inteiras via scanner.", "a agenda inteira já estava aqui: objetividade, amostragem sem viés, apoio à decisão diagnóstica", "campo a campo (sem a lâmina inteira); features manuais; coortes minúsculas; hardware artesanal", "protótipos acadêmicos — sem digitalização em escala, não chegam à rotina. Ficam à espera do scanner de WSI, que na era 1 transforma a prova de conceito em plataforma.", "Hamilton PW et al., J Pathol 1997;182(1):68-75 · Diamond J et al., Hum Pathol 2004;35(9):1121-1131"], "e1": ["Era 1 · 2008–2015", "Morfometria e ML clássico", "features desenhadas à mão + SVM / random forest", "Marco prático: quantificação assistida — contagens, áreas, texturas.", "o humano define o que medir e um classificador raso separa as classes. Interpretável e viável com poucos dados — mas a máquina só vê o que mandaram medir.", "interpretável; poucos dados bastam", "teto baixo: features manuais limitam o alcance", "ferramentas de contagem (Ki-67, mitoses) acopladas ao scanner; uso pontual, não diagnóstico.", "PMID 28626265 (2009) · PMID 27423409 (revisão, 2016) · 2017: FDA aprova o 1º sistema WSI para diagnóstico primário — o alicerce digital de tudo o que segue."], "e2": ["Era 2 · 2013–2018", "CNN supervisionada", "deep learning patch a patch, com anotação forte", "Marco prático: desempenho comparável ao do patologista em tarefas restritas — e padrões sub-visuais (mutações a partir do H&E).", "a rede aprende sozinha as features a partir de milhares de patches rotulados. CAMELYON (2018) dá o benchmark público; Coudray (2018) mostra que o genótipo deixa rastro visível no fenótipo.", "detecta sinal sub-visual; automatiza a tarefa inteira", "anotação massiva; um modelo = uma tarefa; frágil fora do serviço de origem", "triagem e priorização de casos; CAD acoplado ao scanner. A anotação vira o gargalo que define a era seguinte.", "PMID 23858384 (2013) · PMID 30224757 (Coudray) · PMID 29860392 (CAMELYON)"], "e3": ["Era 3 · 2018–2021", "Supervisão fraca — MIL", "o laudo vira o rótulo; a lâmina vira uma sacola de patches", "Marco prático: escala clínica sem anotar um pixel — e a 1ª autorização do FDA para IA em patologia (Paige Prostate, 2021).", "patches agrupados em \"sacolas\" rotuladas pelo diagnóstico que o laboratório já tinha; a atenção (CLAM) aponta os patches que sustentam o rótulo. Campanella: 44.732 WSIs, AUC > 0,98, 65–75% das lâminas excluíveis com sensibilidade de 100%.", "usa o arquivo como está; escala real; interpretável via atenção", "rótulo grosseiro; precisa de muitas lâminas por tarefa", "triagem de biópsias de próstata na rotina; ganhos de eficiência de até ~65% em pré-triagem assistida.", "PMID 31308507 (Campanella) · PMID 33649564 (CLAM) · FDA De Novo 2021"], "e4": ["Era 4 · 2021–2023", "Transformers e auto-supervisão", "aprender sem rótulo nenhum — a ponte para a fundação", "Marco prático: representações genéricas reaproveitáveis — o mesmo encoder serve a muitas tarefas.", "o ViT trata cada patch — não a lâmina inteira — como uma sequência de tokens; o treino auto-supervisionado (contrastivo, DINO, masked autoencoding) aprende prevendo partes ocultas, sem nenhum rótulo humano. No nível da lâmina, os embeddings dos patches continuam agregados por MIL/atenção — nenhum transformer \"vê\" a WSI inteira (o HIPT, 2022, empilha níveis hierárquicos de embeddings para ampliar o contexto).", "aproveita arquivos gigantes não anotados; representações reaproveitáveis", "computação pesada; o valor floresce na era seguinte", "pouca aplicação direta — é infraestrutura. A onda sobe discreta em 2021–23 e explode como alicerce dos modelos de fundação.", "1º sinal na literatura: PMID 34531005 (2021) · CTransPath/HIPT 2022"], "e5": ["Era 5 · 2023–2025", "Modelos de fundação", "pré-treinar uma vez, adaptar para tudo", "Marco prático: fine-tuning e few-shot resolvem problemas novos — inclusive doenças raras — com poucos exemplos.", "um encoder auto-supervisionado em escala industrial vira alicerce reutilizável. UNI: 100 mil WSIs, >100 milhões de patches, estado da arte em 34 tarefas, few-shot até 108 tipos de câncer. Virchow: 1,5 milhão de lâminas; pan-câncer AUROC 0,95, superando modelos dedicados justamente nos cânceres raros.", "democratiza o desenvolvimento; vence o gargalo das doenças raras", "treino base caríssimo; viés do pré-treino herda-se em silêncio; validação clínica em curso", "benchmarks clínicos já comparam fundações públicas entre scanners e colorações; a escolha da fundação vira decisão de projeto.", "PMID 38504018 (UNI) · PMID 39039250 (Virchow) · PMID 40240324 (benchmark clínico) · UNI2 (2025)"], "e6": ["Era 6 · 2024 →", "Generativa, visão-linguagem e agentes", "da classificação à conversa — e ao rascunho do laudo", "Marco prático: laudo preliminar automático e interação em linguagem natural com a imagem.", "o encoder visual de fundação é alinhado a um modelo de linguagem. PathChat: copiloto multimodal ajustado com 456 mil instruções, preferido por patologistas em avaliação cega. TITAN: fundação multimodal no nível da lâmina que gera rascunho de laudo e recupera casos raros — zero-shot.", "interface natural; documenta e explica; acelera o laudo", "alucinação existe; responsabilidade e regulação em aberto; o laudo segue sendo ato médico", "assistentes em pilotos; laudo generativo sob supervisão. Fronteira 2026: sistemas agênticos orquestrando detecção + quantificação + texto.", "PMID 38866050 (PathChat) · PMID 41193692 (TITAN) · revisões 2026 sobre IA agêntica"]}, "ch1T": "A explosão da área", "ch1C": "Artigos de IA em patologia por ano (PubMed, corpus de 3.372 artigos). Mais da metade é de 2024–2026; as barras verdes marcam a era da fundação.", "ch2T": "As ondas das técnicas", "ch2C": "% dos artigos de cada ano citando cada família de técnica. As ondas não se substituem — empilham-se: a era seguinte usa a anterior como alicerce.", "wl": ["ML clássico", "CNN / DL supervisionado", "MIL / superv. fraca", "Transformer / auto-superv.", "Modelos de fundação", "Generativa / visão-linguagem"], "footer": "<b>Fontes.</b> Linha do tempo construída a partir de 3.430 abstracts do PubMed (query de IA ∩ patologia digital/computacional, ago/2026; 3.372 pertinentes após triagem) e de revisões em texto completo. Marcos citados pelos PMIDs em cada cartão. Era 0: Hamilton PW et al., J Pathol 1997;182:68-75 e Diamond J et al., Hum Pathol 2004;35:1121-31. Formato inspirado em \"Modern History of Object Recognition\".<br><b>Material de apoio</b> · IA em Patologia Computacional · Dra. Adriana · 2026."}, "en": {"docTitle": "A Modern History of Computer Vision in Pathology — Interactive Infographic", "ui": {"open": "Open all", "close": "Close all", "hint": "Click the year dots, the concepts, the eras and the charts to open and close their content."}, "h1": "A Modern History of <em>Computer Vision in Pathology</em>", "kicker": "Interactive infographic", "sub": "The trajectory of the algorithms that learned to look at slides: from 1990s machine vision to foundation models and generative AI — what each technique enables, what it costs, and the practical milestone each era unlocked.", "mmT": "MiniMap", "mm": [["'97", [["c-grey0", "texture finds dysplasia"]]], ["'04", [["c-grey0", "digital tissue maps"]]], ["'08–'12", [["c-grey", "morphometry on WSI"], ["c-grey", "telepathology"]]], ["'13", [["c-purple", "1st CNN (mitoses)"]]], ["'15", [["c-purple", "DL on patches"]]], ["'17", [["c-grey", "FDA: 1st WSI system"]]], ["'18", [["c-purple", "Coudray"], ["c-lilac", "CAMELYON"]]], ["'19", [["c-lilac", "Campanella (MIL)"]]], ["'21", [["c-lilac", "CLAM"], ["c-lilac", "FDA: Paige Prostate"], ["c-blue", "ViT / distillation"]]], ["'22", [["c-blue", "CTransPath · HIPT"]]], ["'23", [["c-green", "first foundation models"]]], ["'24", [["c-green", "UNI"], ["c-green", "Virchow"], ["c-amber", "PathChat"]]], ["'25", [["c-green", "UNI2 · TITAN"]]], ["'26", [["c-amber", "agentic AI"]]]], "legend": [["#8a93a6", "machine vision (era 0)"], ["#595959", "classical ML"], ["#0072B5", "supervised CNN"], ["#C42127", "MIL / weak supervision"], ["#00A8D8", "transformer / self-supervision"], ["#007A33", "foundation models"], ["#c9821a", "generative / vision-language"]], "cAT": "Imaging & learning concepts", "cA": [["WSI (whole slide image)", "The entire glass slide digitised at gigapixel scale. Far too large for a network to process at once — which is why almost everything starts by tiling."], ["Patch / tile", "A small crop of the WSI (e.g., 256×256 px) processed one at a time. The basic working unit of computer vision in pathology."], ["Feature", "What the model measures to decide. In classical ML, humans define it (nuclear shape, texture); in deep learning, the network learns which features matter on its own."], ["CNN (convolutional network)", "A neural network that scans the image with learned filters, from simple cues (edges) to complex ones (glands). The engine of the 2013–2018 revolution."], ["Annotation & strong supervision", "Manual labelling by the pathologist, pixel by pixel or region by region, telling the network where everything is. Precise — and expensive: the great bottleneck of the CNN era."], ["Transformer / ViT", "An architecture that treats the image as a sequence of \"tokens\". In pathology, the ViT processes one patch at a time — not the whole slide: within the patch, it learns relations between all regions, unconstrained by convolutional neighbourhoods."], ["Self-supervision", "Training with no labels at all: the network learns by predicting hidden parts of the image or matching views of the same region (contrastive, DINO, masked autoencoding)."]], "cBT": "Computational pathology concepts", "cB": [["MIL (multiple instance learning)", "The slide becomes a \"bag\" of patches with a single label — the diagnosis in the report. One positive patch is enough for the bag to be positive; the network discovers which patches support the label."], ["Attention", "A mechanism that weighs how much each patch contributes to the slide-level decision — and, as a bonus, shows where the model \"looked\". It is this attention-based aggregation (in MIL), not a transformer over the whole WSI, that carries the decision to slide level."], ["Embedding", "The numerical \"fingerprint\" an encoder extracts from a patch or slide. Almost everything today is built on top of embeddings."], ["Foundation model", "An encoder pre-trained by self-supervision on hundreds of thousands to millions of slides, reusable across many tasks — nobody starts from scratch anymore."], ["Fine-tuning · few-shot · zero-shot", "Adapting a foundation model with few examples (fine-tuning/few-shot) — or using it with no task examples at all (zero-shot)."], ["Vision-language / generative", "Aligning the visual encoder with a language model: the system starts answering questions about the image and generating text — including report drafts."], ["External validation & regulation", "Testing on services, scanners and populations different from training; for clinical use, regulatory authorisation (FDA/CE). What separates benchmark from bench."]], "roadT": "The road of time", "roadS": "Follow the road: each station is a milestone. Click a year dot to open its card.", "ms": {"m97": ["machine vision", "Texture finds dysplasia", "Texture (co-occurrence) + a linear rule locate dysplastic fields in digitised colorectal mucosa (83–86%).", "1997 · J Pathol 182:68-75 · Hamilton et al."], "m04": ["machine vision", "Digital tissue maps", "Prostate: morphology identifies normal tissue; Haralick texture separates stroma × carcinoma (79.3% of subregions) — and the paper already anticipates the extension to WSIs.", "2004 · Hum Pathol 35:1121-31 · Diamond et al."], "m08": ["classical ML", "Morphometry & classical analysis", "Hand-crafted features (shape, texture, colour) + shallow classifiers, now on digitised whole slides.", "2008–12 · PMID 28626265 (2009)"], "m13": ["CNN", "First CNN in pathology", "Mitotic figure classification at the ICPR challenge: a CNN combined with hand-crafted features — the transition between eras in a single paper.", "2013 · J Pathol Inform · PMID 23858384"], "m15": ["CNN", "Deep learning spreads", "Glioma grading, mitoses and patch-wise segmentation: deep learning starts beating classical ML.", "2015–2016 · e.g. PMID 26958289"], "m16": ["landmark", "The field organises", "Landmark reviews define \"image analysis and machine learning in digital pathology\": challenges, opportunities and the decade's agenda.", "2016 · PMID 27423409"], "m17": ["infrastructure", "FDA clears the 1st WSI system", "First whole-slide imaging system approved for primary diagnosis: the digital foundation without which nothing that follows reaches routine practice.", "2017 · FDA (Philips IntelliSite)"], "m18cam": ["benchmark", "CAMELYON16/17", "1,399 annotated sentinel-node WSIs from 5 centres — the public benchmark that accelerated the metastasis-detection race.", "2018 · GigaScience · PMID 29860392"], "m18cou": ["CNN", "Coudray: seeing the invisible", "Inception v3 separates LUAD × LUSC × normal (AUC 0.97) and predicts 6 mutations (EGFR, KRAS, TP53…) straight from H&E — genotype leaves a visible trace in phenotype.", "2018 · Nat Med · PMID 30224757"], "m19": ["MIL", "Campanella: clinical scale", "MIL with the report as the label: 44,732 WSIs, no manual annotation; AUC > 0.98. Could exclude 65–75% of slides while keeping 100% sensitivity.", "2019 · Nat Med · PMID 31308507"], "m21clam": ["MIL", "CLAM: interpretable attention", "MIL with attention and clustering: data-efficient, generalisable — and it shows where the model looked. The workhorse of the era.", "2021 · Nat Biomed Eng · PMID 33649564"], "m21paige": ["regulation", "Paige Prostate: 1st authorised AI", "FDA authorises (De Novo) the first pathology AI for clinical use — cancer detection in prostate biopsies. Research becomes product.", "2021 · FDA De Novo"], "m22": ["self-superv.", "CTransPath · HIPT", "Self-supervision and ViTs reach histology: patch encoders trained without labels, reusable — the bridge to foundation. The whole slide is still aggregated by MIL/attention.", "2021–2022 · first signal: PMID 34531005"], "m23": ["foundation", "The foundation era is born", "The first \"pathology foundation models\" appear in the literature; the question shifts from \"how to train?\" to \"which foundation to adapt?\".", "2023 · first mentions on PubMed"], "m24uni": ["foundation", "UNI & Virchow", "UNI: 100k WSIs, 34 tasks, few-shot up to 108 cancer types. Virchow: 1.5 million slides; pan-cancer AUROC 0.95 — including 7 rare cancers.", "2024 · Nat Med · PMIDs 38504018, 39039250"], "m24pc": ["generative", "PathChat: the copilot", "A generalist vision-language assistant for pathology: answers questions about the image in natural language; preferred by pathologists over general assistants.", "2024 · Nature · PMID 38866050"], "m25": ["foundation", "TITAN · UNI2", "A multimodal slide-level foundation — aggregating patch embeddings (335k WSIs + reports): retrieves rare cases and drafts reports, zero-shot.", "2025 · Nat Med · PMID 41193692"], "m26": ["frontier", "Agentic AI & validation", "Systems orchestrating detection + quantification + text; clinical benchmarks compare public foundations; regulation and robustness take centre stage.", "2025–2026 · e.g. PMID 40240324"]}, "erasT": "The eras in detail — from moment 0 to era 6", "erasS": "Click each era to expand: how the technique works, the practical milestone, what it gains, what it costs — and where it touches the bench.", "lbl": {"how": "How it works:", "bench": "At the bench:"}, "eras": {"e0": ["Era 0 · 1990s–2000s", "Moment 0 — machine vision before the digital slide", "texture analysis on digitised fields, one at a time — the proof of concept for everything that followed", "Practical milestone: morphology can be quantified and classified by computer — \"machine vision systems\" generate digital maps of tissue composition, field by field.", "a camera coupled to the microscope digitises fields of view; texture features (Haralick's co-occurrence matrix) and morphological measurements feed linear classification rules. Hamilton et al. (1997) automatically locate dysplastic fields in colorectal mucosa (83–86% accuracy) — solving \"the first stage of the diagnostic process\": finding where to look. Diamond et al. (2004) map prostatic tissue: morphology identifies normal tissue, Haralick texture separates stroma from carcinoma (79.3% of subregions correct) — and the paper itself anticipates the logical extension of the method to whole-slide images via scanners.", "the whole agenda was already here: objectivity, unbiased sampling, diagnostic decision support", "field by field (no whole slide); hand-crafted features; tiny cohorts; artisanal hardware", "academic prototypes — without digitisation at scale they never reach routine. They wait for the WSI scanner, which in era 1 turns the proof of concept into a platform.", "Hamilton PW et al., J Pathol 1997;182(1):68-75 · Diamond J et al., Hum Pathol 2004;35(9):1121-1131"], "e1": ["Era 1 · 2008–2015", "Morphometry & classical ML", "hand-crafted features + SVM / random forest", "Practical milestone: assisted quantification — counts, areas, textures.", "humans define what to measure and a shallow classifier separates the classes. Interpretable and viable with little data — but the machine only sees what it was told to measure.", "interpretable; little data suffices", "low ceiling: hand-crafted features limit the reach", "counting tools (Ki-67, mitoses) attached to the scanner; niche use, not diagnostic.", "PMID 28626265 (2009) · PMID 27423409 (review, 2016) · 2017: FDA approves the 1st WSI system for primary diagnosis — the digital groundwork for all that follows."], "e2": ["Era 2 · 2013–2018", "Supervised CNN", "patch-by-patch deep learning with strong annotation", "Practical milestone: pathologist-level performance on narrow tasks — and sub-visual patterns (mutations from H&E).", "the network learns features on its own from thousands of labelled patches. CAMELYON (2018) provides the public benchmark; Coudray (2018) shows genotype leaves a visible trace in phenotype.", "detects sub-visual signal; automates the whole task", "massive annotation; one model = one task; fragile outside the origin lab", "case triage and prioritisation; CAD attached to the scanner. Annotation becomes the bottleneck that defines the next era.", "PMID 23858384 (2013) · PMID 30224757 (Coudray) · PMID 29860392 (CAMELYON)"], "e3": ["Era 3 · 2018–2021", "Weak supervision — MIL", "the report becomes the label; the slide becomes a bag of patches", "Practical milestone: clinical scale without annotating a single pixel — and the FDA's 1st authorisation of pathology AI (Paige Prostate, 2021).", "patches grouped into \"bags\" labelled by the diagnosis the lab already had; attention (CLAM) points to the patches supporting the label. Campanella: 44,732 WSIs, AUC > 0.98, 65–75% of slides excludable at 100% sensitivity.", "uses the archive as-is; real scale; interpretable via attention", "coarse label; needs many slides per task", "prostate biopsy triage in routine practice; efficiency gains of up to ~65% in assisted pre-screening.", "PMID 31308507 (Campanella) · PMID 33649564 (CLAM) · FDA De Novo 2021"], "e4": ["Era 4 · 2021–2023", "Transformers & self-supervision", "learning with no labels at all — the bridge to foundation", "Practical milestone: generic, reusable representations — the same encoder serves many tasks.", "the ViT treats each patch — not the whole slide — as a sequence of tokens; self-supervised training (contrastive, DINO, masked autoencoding) learns by predicting hidden parts, with no human labels. At slide level, patch embeddings are still aggregated by MIL/attention — no transformer \"sees\" the entire WSI (HIPT, 2022, stacks hierarchical levels of embeddings to widen context).", "exploits huge unannotated archives; reusable representations", "heavy compute; the value blossoms in the next era", "little direct bench application — it is infrastructure. The wave rises quietly in 2021–23 and explodes as the bedrock of foundation models.", "first signal in the literature: PMID 34531005 (2021) · CTransPath/HIPT 2022"], "e5": ["Era 5 · 2023–2025", "Foundation models", "pre-train once, adapt for everything", "Practical milestone: fine-tuning and few-shot solve new problems — including rare diseases — with few examples.", "an industrially-scaled self-supervised encoder becomes a reusable bedrock. UNI: 100k WSIs, >100 million patches, state of the art on 34 tasks, few-shot up to 108 cancer types. Virchow: 1.5 million slides; pan-cancer AUROC 0.95, beating dedicated models precisely on rare cancers.", "democratises development; beats the rare-disease bottleneck", "base training is extremely costly; pre-training bias is inherited silently; clinical validation ongoing", "clinical benchmarks already compare public foundations across scanners and stains; choosing the foundation becomes a design decision.", "PMID 38504018 (UNI) · PMID 39039250 (Virchow) · PMID 40240324 (clinical benchmark) · UNI2 (2025)"], "e6": ["Era 6 · 2024 →", "Generative, vision-language & agents", "from classification to conversation — and to the report draft", "Practical milestone: automatic preliminary reports and natural-language interaction with the image.", "the visual foundation encoder is aligned with a language model. PathChat: a multimodal copilot tuned with 456k instructions, preferred by pathologists in blinded evaluation. TITAN: a slide-level multimodal foundation that drafts reports and retrieves rare cases — zero-shot.", "natural interface; documents and explains; speeds up reporting", "hallucination exists; responsibility and regulation open; the report remains a medical act", "assistants in pilots; generative reporting under supervision. The 2026 frontier: agentic systems orchestrating detection + quantification + text.", "PMID 38866050 (PathChat) · PMID 41193692 (TITAN) · 2026 reviews on agentic AI"]}, "ch1T": "The field explodes", "ch1C": "AI-in-pathology papers per year (PubMed, corpus of 3,372 papers). More than half are from 2024–2026; green bars mark the foundation era.", "ch2T": "The waves of techniques", "ch2C": "% of each year's papers citing each technique family. The waves do not replace one another — they stack: each era uses the previous one as bedrock.", "wl": ["Classical ML", "Supervised CNN / DL", "MIL / weak supervision", "Transformer / self-superv.", "Foundation models", "Generative / vision-language"], "footer": "<b>Sources.</b> Timeline built from 3,430 PubMed abstracts (AI ∩ digital/computational pathology query, Aug/2026; 3,372 relevant after screening) and full-text reviews. Milestones cited by PMID on each card. Era 0: Hamilton PW et al., J Pathol 1997;182:68-75 and Diamond J et al., Hum Pathol 2004;35:1121-31. Format inspired by \"Modern History of Object Recognition\".<br><b>Support material</b> · AI in Computational Pathology · Dr. Adriana · 2026."}, "es": {"docTitle": "Historia Moderna de la Visión Computacional en Patología — Infografía Interactiva", "ui": {"open": "Abrir todo", "close": "Cerrar todo", "hint": "Haz clic en los círculos de los años, en los conceptos, en las eras y en los gráficos para abrir y cerrar el contenido."}, "h1": "Historia Moderna de la <em>Visión Computacional en Patología</em>", "kicker": "Infografía interactiva", "sub": "La trayectoria de los algoritmos que aprendieron a mirar láminas: de la visión de máquina de los años 90 a los modelos de fundación y la IA generativa — qué permite cada técnica, qué cuesta y el hito práctico que cada era desbloqueó.", "mmT": "MiniMapa", "mm": [["'97", [["c-grey0", "la textura localiza displasia"]]], ["'04", [["c-grey0", "mapas digitales de tejido"]]], ["'08–'12", [["c-grey", "morfometría en WSI"], ["c-grey", "telepatología"]]], ["'13", [["c-purple", "1ª CNN (mitosis)"]]], ["'15", [["c-purple", "DL en parches"]]], ["'17", [["c-grey", "FDA: 1er sistema WSI"]]], ["'18", [["c-purple", "Coudray"], ["c-lilac", "CAMELYON"]]], ["'19", [["c-lilac", "Campanella (MIL)"]]], ["'21", [["c-lilac", "CLAM"], ["c-lilac", "FDA: Paige Prostate"], ["c-blue", "ViT / destilación"]]], ["'22", [["c-blue", "CTransPath · HIPT"]]], ["'23", [["c-green", "1ros modelos de fundación"]]], ["'24", [["c-green", "UNI"], ["c-green", "Virchow"], ["c-amber", "PathChat"]]], ["'25", [["c-green", "UNI2 · TITAN"]]], ["'26", [["c-amber", "IA agéntica"]]]], "legend": [["#8a93a6", "visión de máquina (era 0)"], ["#595959", "ML clásico"], ["#0072B5", "CNN supervisada"], ["#C42127", "MIL / supervisión débil"], ["#00A8D8", "transformer / autosupervisión"], ["#007A33", "modelos de fundación"], ["#c9821a", "generativa / visión-lenguaje"]], "cAT": "Conceptos de imagen y aprendizaje", "cA": [["WSI (whole slide image)", "La lámina completa digitalizada en gigapíxeles. Demasiado grande para que una red la procese de una vez — por eso casi todo empieza recortando."], ["Parche / tile", "Recorte pequeño de la WSI (p. ej., 256×256 px) procesado uno a uno. La unidad básica de trabajo de la visión computacional en patología."], ["Feature (característica)", "Lo que el modelo mide para decidir. En el ML clásico la define el humano (forma nuclear, textura); en el deep learning la red aprende sola qué características importan."], ["CNN (red convolucional)", "Red neuronal que recorre la imagen con filtros aprendidos, de rasgos simples (bordes) a complejos (glándulas). El motor de la revolución 2013–2018."], ["Anotación y supervisión fuerte", "Marcación manual del patólogo, píxel a píxel o región a región, indicando a la red dónde está cada cosa. Precisa — y cara: el gran cuello de botella de la era CNN."], ["Transformer / ViT", "Arquitectura que trata la imagen como una secuencia de \"tokens\". En patología, el ViT procesa un parche a la vez — no la lámina entera: dentro del parche aprende relaciones entre todas las regiones, sin limitarse a la vecindad de los filtros convolucionales."], ["Autosupervisión", "Entrenar sin ninguna etiqueta: la red aprende prediciendo partes ocultas de la imagen o acercando vistas de la misma región (contrastivo, DINO, masked autoencoding)."]], "cBT": "Conceptos de patología computacional", "cB": [["MIL (multiple instance learning)", "La lámina se convierte en una \"bolsa\" de parches con una sola etiqueta — el diagnóstico del informe. Basta un parche positivo para que la bolsa sea positiva; la red descubre qué parches sostienen la etiqueta."], ["Atención (attention)", "Mecanismo que pondera cuánto contribuye cada parche a la decisión de la lámina — y, de paso, muestra dónde \"miró\" el modelo. Es esta agregación por atención (en MIL), y no un transformer sobre toda la WSI, la que lleva la decisión al nivel de la lámina."], ["Embedding", "La \"huella digital\" numérica que un encoder extrae de un parche o de una lámina. Casi todo hoy se construye sobre embeddings."], ["Modelo de fundación (foundation model)", "Encoder preentrenado por autosupervisión en cientos de miles a millones de láminas, reutilizable para muchas tareas — ya nadie empieza de cero."], ["Fine-tuning · few-shot · zero-shot", "Adaptar el modelo de fundación con pocos ejemplos (fine-tuning/few-shot) — o usarlo sin ningún ejemplo de la tarea (zero-shot)."], ["Visión-lenguaje / generativa", "Alinear el encoder visual con un modelo de lenguaje: el sistema pasa a responder preguntas sobre la imagen y a generar texto — incluidos borradores de informe."], ["Validación externa y regulación", "Probar en servicios, escáneres y poblaciones distintos de los de entrenamiento; para uso clínico, autorización regulatoria (FDA/CE). Lo que separa el benchmark de la mesa de trabajo."]], "roadT": "La carretera del tiempo", "roadS": "Sigue la carretera: cada estación es un hito. Haz clic en el círculo del año para abrir su tarjeta.", "ms": {"m97": ["visión de máquina", "La textura localiza la displasia", "Textura (co-ocurrencia) + regla lineal localizan campos displásicos en mucosa colorrectal digitalizada (83–86%).", "1997 · J Pathol 182:68-75 · Hamilton et al."], "m04": ["visión de máquina", "Mapas digitales del tejido", "Próstata: la morfología identifica el tejido normal; la textura de Haralick separa estroma × carcinoma (79,3% de las subregiones) — y el artículo ya anticipa la extensión a WSIs.", "2004 · Hum Pathol 35:1121-31 · Diamond et al."], "m08": ["ML clásico", "Morfometría y análisis clásico", "Features manuales (forma, textura, color) + clasificadores simples, ahora sobre láminas digitalizadas.", "2008–12 · PMID 28626265 (2009)"], "m13": ["CNN", "Primera CNN en patología", "Clasificación de figuras de mitosis en el desafío ICPR: CNN combinada con features manuales — la transición entre eras en un solo artículo.", "2013 · J Pathol Inform · PMID 23858384"], "m15": ["CNN", "El deep learning se expande", "Grading de gliomas, mitosis y segmentación parche a parche: el deep learning empieza a superar al ML clásico.", "2015–2016 · ej.: PMID 26958289"], "m16": ["hito", "El campo se organiza", "Revisiones-hito definen el \"análisis de imagen y machine learning en patología digital\": desafíos, oportunidades y la agenda de la década.", "2016 · PMID 27423409"], "m17": ["infraestructura", "La FDA aprueba el 1er sistema WSI", "Primer sistema de imagen de lámina completa aprobado para diagnóstico primario: la base digital sin la cual nada de lo que sigue llega a la rutina.", "2017 · FDA (Philips IntelliSite)"], "m18cam": ["benchmark", "CAMELYON16/17", "1.399 WSIs de ganglio centinela, anotadas, de 5 centros — el benchmark público que aceleró la carrera de la detección de metástasis.", "2018 · GigaScience · PMID 29860392"], "m18cou": ["CNN", "Coudray: ver lo invisible", "Inception v3 separa LUAD × LUSC × normal (AUC 0,97) y predice 6 mutaciones (EGFR, KRAS, TP53…) directamente del H&E — el genotipo deja rastro en el fenotipo.", "2018 · Nat Med · PMID 30224757"], "m19": ["MIL", "Campanella: escala clínica", "MIL con el informe como etiqueta: 44.732 WSIs, sin anotación manual; AUC > 0,98. Excluiría el 65–75% de las láminas manteniendo una sensibilidad del 100%.", "2019 · Nat Med · PMID 31308507"], "m21clam": ["MIL", "CLAM: atención interpretable", "MIL con atención y clustering: eficiente en datos, generalizable — y muestra dónde miró el modelo. La herramienta de trabajo de la era.", "2021 · Nat Biomed Eng · PMID 33649564"], "m21paige": ["regulación", "Paige Prostate: 1ª IA autorizada", "La FDA autoriza (De Novo) la primera IA de patología para uso clínico — detección de cáncer en biopsias de próstata. La investigación se convierte en producto.", "2021 · FDA De Novo"], "m22": ["autosuperv.", "CTransPath · HIPT", "La autosupervisión y los ViTs llegan a la histología: encoders de parches entrenados sin etiquetas, reutilizables — el puente hacia la fundación. La lámina completa sigue agregándose por MIL/atención.", "2021–2022 · 1ª señal: PMID 34531005"], "m23": ["fundación", "Nace la era de la fundación", "Los primeros \"pathology foundation models\" aparecen en la literatura; la pregunta cambia de \"¿cómo entrenar?\" a \"¿qué fundación adaptar?\".", "2023 · primeras menciones en PubMed"], "m24uni": ["fundación", "UNI & Virchow", "UNI: 100 mil WSIs, 34 tareas, few-shot hasta 108 tipos de cáncer. Virchow: 1,5 millones de láminas; pan-cáncer AUROC 0,95 — incluidos 7 cánceres raros.", "2024 · Nat Med · PMIDs 38504018, 39039250"], "m24pc": ["generativa", "PathChat: el copiloto", "Visión-lenguaje generalista para patología: responde preguntas sobre la imagen en lenguaje natural; preferido por los patólogos frente a asistentes generales.", "2024 · Nature · PMID 38866050"], "m25": ["fundación", "TITAN · UNI2", "Fundación multimodal a nivel de lámina — agrega los embeddings de los parches (335 mil WSIs + informes): recupera casos raros y genera borradores de informe, zero-shot.", "2025 · Nat Med · PMID 41193692"], "m26": ["frontera", "IA agéntica y validación", "Sistemas que orquestan detección + cuantificación + texto; benchmarks clínicos comparan fundaciones públicas; la regulación y la robustez pasan al centro del debate.", "2025–2026 · ej.: PMID 40240324"]}, "erasT": "Las eras en detalle — del momento 0 a la era 6", "erasS": "Haz clic en cada era para expandir: cómo funciona la técnica, el hito práctico, qué gana, qué cuesta — y dónde toca la mesa de trabajo.", "lbl": {"how": "Cómo funciona:", "bench": "En la práctica:"}, "eras": {"e0": ["Era 0 · años 1990–2000", "Momento 0 — visión de máquina antes de la lámina digital", "análisis de textura en campos digitalizados, uno a uno — la prueba de concepto de todo lo que vino después", "Hito práctico: la morfología puede cuantificarse y clasificarse por computadora — los \"machine vision systems\" generan mapas digitales de composición del tejido, campo a campo.", "una cámara acoplada al microscopio digitaliza campos de visión; features de textura (matriz de co-ocurrencia de Haralick) y medidas morfológicas alimentan reglas de clasificación lineales. Hamilton et al. (1997) localizan automáticamente los campos displásicos en mucosa colorrectal (83–86% de acierto) — resolviendo \"la primera etapa del proceso diagnóstico\": encontrar dónde mirar. Diamond et al. (2004) mapean el tejido prostático: la morfología identifica el tejido normal, la textura de Haralick separa estroma de carcinoma (79,3% de las subregiones correctas) — y el propio artículo anticipa la extensión lógica del método a las láminas completas vía escáner.", "toda la agenda ya estaba aquí: objetividad, muestreo sin sesgo, apoyo a la decisión diagnóstica", "campo a campo (sin la lámina completa); features manuales; cohortes minúsculas; hardware artesanal", "prototipos académicos — sin digitalización a escala, no llegan a la rutina. Esperan al escáner de WSI, que en la era 1 convierte la prueba de concepto en plataforma.", "Hamilton PW et al., J Pathol 1997;182(1):68-75 · Diamond J et al., Hum Pathol 2004;35(9):1121-1131"], "e1": ["Era 1 · 2008–2015", "Morfometría y ML clásico", "features diseñadas a mano + SVM / random forest", "Hito práctico: cuantificación asistida — conteos, áreas, texturas.", "el humano define qué medir y un clasificador simple separa las clases. Interpretable y viable con pocos datos — pero la máquina solo ve lo que le mandaron medir.", "interpretable; bastan pocos datos", "techo bajo: las features manuales limitan el alcance", "herramientas de conteo (Ki-67, mitosis) acopladas al escáner; uso puntual, no diagnóstico.", "PMID 28626265 (2009) · PMID 27423409 (revisión, 2016) · 2017: la FDA aprueba el 1er sistema WSI para diagnóstico primario — el cimiento digital de todo lo que sigue."], "e2": ["Era 2 · 2013–2018", "CNN supervisada", "deep learning parche a parche, con anotación fuerte", "Hito práctico: desempeño comparable al del patólogo en tareas acotadas — y patrones sub-visuales (mutaciones a partir del H&E).", "la red aprende sola las features a partir de miles de parches etiquetados. CAMELYON (2018) da el benchmark público; Coudray (2018) muestra que el genotipo deja rastro visible en el fenotipo.", "detecta señal sub-visual; automatiza la tarea completa", "anotación masiva; un modelo = una tarea; frágil fuera del servicio de origen", "triaje y priorización de casos; CAD acoplado al escáner. La anotación se vuelve el cuello de botella que define la era siguiente.", "PMID 23858384 (2013) · PMID 30224757 (Coudray) · PMID 29860392 (CAMELYON)"], "e3": ["Era 3 · 2018–2021", "Supervisión débil — MIL", "el informe se vuelve la etiqueta; la lámina, una bolsa de parches", "Hito práctico: escala clínica sin anotar un píxel — y la 1ª autorización de la FDA para IA en patología (Paige Prostate, 2021).", "parches agrupados en \"bolsas\" etiquetadas por el diagnóstico que el laboratorio ya tenía; la atención (CLAM) señala los parches que sostienen la etiqueta. Campanella: 44.732 WSIs, AUC > 0,98, 65–75% de las láminas excluibles con sensibilidad del 100%.", "usa el archivo tal cual; escala real; interpretable vía atención", "etiqueta gruesa; necesita muchas láminas por tarea", "triaje de biopsias de próstata en la rutina; ganancias de eficiencia de hasta ~65% en precribado asistido.", "PMID 31308507 (Campanella) · PMID 33649564 (CLAM) · FDA De Novo 2021"], "e4": ["Era 4 · 2021–2023", "Transformers y autosupervisión", "aprender sin ninguna etiqueta — el puente hacia la fundación", "Hito práctico: representaciones genéricas reutilizables — el mismo encoder sirve para muchas tareas.", "el ViT trata cada parche — no la lámina completa — como una secuencia de tokens; el entrenamiento autosupervisado (contrastivo, DINO, masked autoencoding) aprende prediciendo partes ocultas, sin etiquetas humanas. A nivel de lámina, los embeddings de los parches siguen agregándose por MIL/atención — ningún transformer \"ve\" la WSI entera (HIPT, 2022, apila niveles jerárquicos de embeddings para ampliar el contexto).", "aprovecha archivos gigantes sin anotar; representaciones reutilizables", "cómputo pesado; el valor florece en la era siguiente", "poca aplicación directa — es infraestructura. La ola sube discreta en 2021–23 y explota como cimiento de los modelos de fundación.", "1ª señal en la literatura: PMID 34531005 (2021) · CTransPath/HIPT 2022"], "e5": ["Era 5 · 2023–2025", "Modelos de fundación", "preentrenar una vez, adaptar para todo", "Hito práctico: fine-tuning y few-shot resuelven problemas nuevos — incluidas enfermedades raras — con pocos ejemplos.", "un encoder autosupervisado a escala industrial se vuelve cimiento reutilizable. UNI: 100 mil WSIs, >100 millones de parches, estado del arte en 34 tareas, few-shot hasta 108 tipos de cáncer. Virchow: 1,5 millones de láminas; pan-cáncer AUROC 0,95, superando a modelos dedicados justamente en los cánceres raros.", "democratiza el desarrollo; vence el cuello de botella de las enfermedades raras", "entrenamiento base carísimo; el sesgo del preentrenamiento se hereda en silencio; validación clínica en curso", "los benchmarks clínicos ya comparan fundaciones públicas entre escáneres y tinciones; elegir la fundación se vuelve una decisión de diseño.", "PMID 38504018 (UNI) · PMID 39039250 (Virchow) · PMID 40240324 (benchmark clínico) · UNI2 (2025)"], "e6": ["Era 6 · 2024 →", "Generativa, visión-lenguaje y agentes", "de la clasificación a la conversación — y al borrador del informe", "Hito práctico: informe preliminar automático e interacción en lenguaje natural con la imagen.", "el encoder visual de fundación se alinea con un modelo de lenguaje. PathChat: copiloto multimodal ajustado con 456 mil instrucciones, preferido por los patólogos en evaluación ciega. TITAN: fundación multimodal a nivel de lámina que genera borradores de informe y recupera casos raros — zero-shot.", "interfaz natural; documenta y explica; acelera el informe", "la alucinación existe; responsabilidad y regulación abiertas; el informe sigue siendo un acto médico", "asistentes en pilotos; informe generativo bajo supervisión. Frontera 2026: sistemas agénticos orquestando detección + cuantificación + texto.", "PMID 38866050 (PathChat) · PMID 41193692 (TITAN) · revisiones 2026 sobre IA agéntica"]}, "ch1T": "La explosión del área", "ch1C": "Artículos de IA en patología por año (PubMed, corpus de 3.372 artículos). Más de la mitad son de 2024–2026; las barras verdes marcan la era de la fundación.", "ch2T": "Las olas de las técnicas", "ch2C": "% de los artículos de cada año que citan cada familia de técnicas. Las olas no se sustituyen — se apilan: cada era usa la anterior como cimiento.", "wl": ["ML clásico", "CNN / DL supervisado", "MIL / superv. débil", "Transformer / autosuperv.", "Modelos de fundación", "Generativa / visión-lenguaje"], "footer": "<b>Fuentes.</b> Línea de tiempo construida a partir de 3.430 abstracts de PubMed (query de IA ∩ patología digital/computacional, ago/2026; 3.372 pertinentes tras el cribado) y revisiones a texto completo. Hitos citados por PMID en cada tarjeta. Era 0: Hamilton PW et al., J Pathol 1997;182:68-75 y Diamond J et al., Hum Pathol 2004;35:1121-31. Formato inspirado en \"Modern History of Object Recognition\".<br><b>Material de apoyo</b> · IA en Patología Computacional · Dra. Adriana · 2026."}};
let lang = "pt";

const $ = id => document.getElementById(id);
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}

function buildRoad(){
  const road = $('road');
  MS.forEach(m=>{
    const st=document.createElement('div');
    st.className='station'; st.id='st_'+m.id;
    st.style.left=m.sx+'px'; st.style.top=m.sy+'px';
    st.style.borderColor=m.c; st.style.color=(m.c==='#8a93a6')?'#595959':m.c;
    st.innerHTML='<span class="lab">'+m.lab+'</span><span class="plus">+</span>';
    st.addEventListener('click',()=>toggleCard(m.id));
    road.appendChild(st);
    const cd=document.createElement('div');
    cd.className='mcard'; cd.id='cd_'+m.id;
    cd.style.left=m.cl+'px'; cd.style.top=m.ct+'px';
    road.appendChild(cd);
  });
}
function toggleCard(id, force){
  const cd=$('cd_'+id), st=$('st_'+id);
  const show = force!==undefined ? force : !cd.classList.contains('show');
  cd.classList.toggle('show', show);
  st.classList.toggle('on', show);
  st.querySelector('.plus').textContent = show?'–':'+';
}
function buildEras(){
  const g=$('erasGrid');
  ERAS_S.forEach(e=>{
    const c=document.createElement('div');
    c.className='era-card'; c.id='era_'+e.id;
    c.style.borderTopColor=e.c;
    if(e.wide) c.style.gridColumn='1 / -1';
    c.innerHTML='<div class="era-head"><span class="era-tag" style="background:'+e.c+'"></span>'+
      '<h3></h3><div class="years"></div><span class="pl">+</span></div>'+
      '<div class="era-body"><div class="evento" style="background:'+e.tint+'"></div>'+
      '<div class="tech"></div><div class="pm"><div class="p"></div><div class="m"></div></div>'+
      '<div class="bench"></div><div class="refs"></div></div>';
    c.querySelector('.era-head').addEventListener('click',()=>c.classList.toggle('open'));
    g.appendChild(c);
  });
}
function render(){
  const t=L[lang];
  document.documentElement.lang = {pt:'pt-BR',en:'en',es:'es'}[lang];
  document.title=t.docTitle;
  $('kicker').textContent=t.kicker; $('h1').innerHTML=t.h1; $('sub').textContent=t.sub;
  $('openAll').textContent=t.ui.open; $('closeAll').textContent=t.ui.close; $('hint').textContent=t.ui.hint;
  $('mmT').textContent=t.mmT;
  $('mmGrid').innerHTML=t.mm.map(g=>'<span class="yr">'+esc(g[0])+'</span>'+
      g[1].map(ch=>'<span class="chip '+ch[0]+'">'+esc(ch[1])+'</span>').join('')).join('');
  $('legend').innerHTML=t.legend.map(l=>'<span><span class="dot" style="background:'+l[0]+'"></span>'+esc(l[1])+'</span>').join('');
  $('cAT').textContent=t.cAT; $('cBT').textContent=t.cBT;
  const mkC=(items)=>items.map((it,i)=>'<div class="citem"><div class="ct">'+esc(it[0])+
      '<span class="pl">+</span></div><div class="cd">'+esc(it[1])+'</div></div>').join('');
  $('cAPanel').innerHTML=mkC(t.cA); $('cBPanel').innerHTML=mkC(t.cB);
  document.querySelectorAll('.citem .ct').forEach(el=>{
    el.addEventListener('click',()=>el.parentElement.classList.toggle('open'));
  });
  $('roadT').textContent=t.roadT; $('roadS').textContent=t.roadS;
  MS.forEach(m=>{
    const d=t.ms[m.id];
    $('cd_'+m.id).innerHTML='<span class="x">✕</span><span class="tag '+m.tagc+'">'+esc(d[0])+'</span>'+
      '<div class="t">'+esc(d[1])+'</div><p>'+esc(d[2])+'</p><div class="ref">'+esc(d[3])+'</div>';
    $('cd_'+m.id).querySelector('.x').addEventListener('click',()=>toggleCard(m.id,false));
  });
  $('erasT').textContent=t.erasT; $('erasS').textContent=t.erasS;
  ERAS_S.forEach(e=>{
    const d=t.eras[e.id], c=$('era_'+e.id);
    c.querySelector('.era-tag').textContent=d[0];
    c.querySelector('h3').textContent=d[1];
    c.querySelector('.years').textContent=d[2];
    c.querySelector('.evento').textContent=d[3];
    c.querySelector('.tech').innerHTML='<b>'+esc(t.lbl.how)+'</b> '+esc(d[4]);
    c.querySelector('.pm .p').innerHTML='<b>+</b> '+esc(d[5]);
    c.querySelector('.pm .m').innerHTML='<b>−</b> '+esc(d[6]);
    c.querySelector('.bench').innerHTML='<b>'+esc(t.lbl.bench)+'</b> '+esc(d[7]);
    c.querySelector('.refs').textContent=d[8];
  });
  $('ch1T').textContent=t.ch1T; $('ch1C').textContent=t.ch1C;
  $('ch2T').textContent=t.ch2T; $('ch2C').textContent=t.ch2C;
  $('waveLegend').innerHTML=t.wl.map((n,i)=>'<span><span class="dot" style="background:'+WAVE_COLORS[i]+'"></span>'+esc(n)+'</span>').join('');
  $('footer').innerHTML=t.footer;
  document.querySelectorAll('.lbtn').forEach(b=>b.classList.toggle('on', b.dataset.lang===lang));
}
function setAll(open){
  MS.forEach(m=>toggleCard(m.id, open));
  document.querySelectorAll('.era-card').forEach(c=>c.classList.toggle('open', open));
  document.querySelectorAll('.citem').forEach(c=>c.classList.toggle('open', open));
  document.querySelectorAll('[data-coll]').forEach(b=>b.parentElement.classList.toggle('coll', false));
}
document.querySelectorAll('.lbtn').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.lang; render();}));
document.querySelectorAll('[data-coll]').forEach(b=>{
  b.addEventListener('click',()=>b.parentElement.classList.toggle('coll'));
});
$('openAll').addEventListener('click',()=>setAll(true));
$('closeAll').addEventListener('click',()=>setAll(false));
buildRoad(); buildEras(); render();
// estado inicial: minimapa aberto, conceitos/gráficos fechados
document.querySelectorAll('#cAWrap,#cBWrap,#ch1Wrap,#ch2Wrap').forEach(w=>w.classList.add('coll'));
</script>
</body></html>
